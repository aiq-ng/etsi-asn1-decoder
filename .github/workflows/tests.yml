name: Decoder library

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
      - name: Test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "${{ github.workspace }}/tests" -v
      - run: etsi-asn1-decoder --help
        working-directory: ${{ runner.temp }}
